version: '3.8'

services:
  backend:
    build: ./backend
    container_name: nexus_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./nexus.db
      - SECRET_KEY=nexus_workspace_secret_key_2026_prod
      - CORS_ORIGINS=["*"]

  frontend:
    build: ./frontend
    container_name: nexus_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
